<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/icon-180.png">
    <title>{{ video_title }} - StreamServe</title>
    <link rel="stylesheet" href="/static/front.css">
    <link rel="stylesheet" href="/static/player.css">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background-color: var(--bg);
        }
        body {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .video-container {
            /* Fills whatever the viewport leaves after the header, rather than
               shrink-wrapping the video -- that's what lets the video below
               grow to match it instead of sitting at a fixed 960px on a much
               bigger screen. */
            flex: 1;
            min-height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }
        video {
            /* object-fit: contain scales to fill the available box in both
               dimensions -- up or down -- while keeping the video's own
               aspect ratio, so a portrait clip gets the height a fixed
               max-width could never give it, and a landscape one still gets
               letterboxed instead of stretched. */
            width: 100%;
            height: 100%;
            object-fit: contain;
            outline: none;
            background: #000;
        }
    </style>
</head>
<body>
    {% include '_header.html' %}
    <div class="video-container">
        <video id="my-video" controls preload="metadata" loop playsinline
               {% if has_subtitles %}crossorigin="anonymous"{% endif %}>
            <source src="/videos/{{ video_id }}?folder={{ folder | urlencode }}" type="video/mp4">
            {% if has_subtitles %}
            {# Served as WebVTT whatever the sidecar file on disk actually is. #}
            <track kind="subtitles" label="Subtitles" srclang="en" default
                   src="/videos/{{ video_id }}/subtitles?folder={{ folder | urlencode }}">
            {% endif %}
            Your browser does not support the video tag.
        </video>
    </div>
    <script>
      (function () {
          const video = document.getElementById('my-video');
          const nav = window.streamserve || {};

          // Shortcuts are ignored while a text field has focus, so typing a
          // title in the edit dialog does not seek the video underneath it.
          function isTyping(target) {
              if (!target) {
                  return false;
              }
              const tag = target.tagName;
              return tag === 'INPUT' || tag === 'TEXTAREA' || target.isContentEditable;
          }

          const SEEK_SECONDS = 5;
          const VOLUME_STEP = 0.1;

          document.addEventListener('keydown', function (event) {
              if (isTyping(event.target) || event.metaKey || event.ctrlKey || event.altKey) {
                  return;
              }

              const actions = {
                  ' ': () => (video.paused ? video.play() : video.pause()),
                  k: () => (video.paused ? video.play() : video.pause()),
                  ArrowRight: () => { video.currentTime += SEEK_SECONDS; },
                  ArrowLeft: () => { video.currentTime -= SEEK_SECONDS; },
                  ArrowUp: () => { video.volume = Math.min(1, video.volume + VOLUME_STEP); },
                  ArrowDown: () => { video.volume = Math.max(0, video.volume - VOLUME_STEP); },
                  m: () => { video.muted = !video.muted; },
                  f: () => {
                      if (document.fullscreenElement) {
                          document.exitFullscreen();
                      } else if (video.requestFullscreen) {
                          video.requestFullscreen();
                      }
                  },
                  Escape: () => {
                      if (!document.fullscreenElement) {
                          window.location.href = nav.backUrl || '/';
                      }
                  }
              };

              const action = actions[event.key];
              if (action) {
                  // Space would scroll and the arrows would move the page;
                  // the video is the only thing that should respond here.
                  event.preventDefault();
                  action();
              }
          });
      })();

      (function () {
          const button = document.getElementById('thumbnail-button');
          const videoId = document.querySelector('.header').dataset.videoId;

          button.addEventListener('click', async function () {
              button.disabled = true;
              try {
                  const video = document.getElementById('my-video');
                  const seconds = Math.max(0, Math.floor(video.currentTime));
                  const pad = (value) => String(value).padStart(2, '0');
                  const timecode = `${pad(Math.floor(seconds / 3600))}:${pad(Math.floor((seconds % 3600) / 60))}:${pad(seconds % 60)}`;

                  const response = await fetch(
                      `/api/videos/${encodeURIComponent(videoId)}/thumbnail?time=${encodeURIComponent(timecode)}&folder=${encodeURIComponent(document.querySelector('.header').dataset.folder)}`,
                      { method: 'POST' }
                  );
                  if (!response.ok) {
                      const problem = await response.json().catch(() => ({}));
                      throw new Error(problem.detail || 'Thumbnail generation failed.');
                  }
                  window.location.href = document.querySelector('.header').dataset.backUrl || '/';
              } catch (error) {
                  alert(error.message);
              } finally {
                  button.disabled = false;
              }
          });
      })();
  </script>
</body>
</html>
