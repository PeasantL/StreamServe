[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = [
    # `range` shadows the builtin, but it is the header name FastAPI binds on.
    "A002",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning",
    # Starlette 0.41 still imports this AnyIO alias in its TestClient.
    'ignore:The anyio\.abc\.BlockingPortal alias is deprecated:DeprecationWarning',
]
